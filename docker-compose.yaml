services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"   # RabbitMQ code communication port 
      - "15672:15672" # ui dashboard 
    networks:
      - ds-network

  user-db:
    image: postgres:15
    container_name: user_postgres_db
    environment:
      POSTGRES_USER: abdulla
      POSTGRES_PASSWORD: password123!
      POSTGRES_DB: user_service_db
    ports:
      - "5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data # data Protection against loss    
    networks:
      - ds-network

  # خدمة الـ User بـ .NET
  user-service:
    build: ./User-Service
    container_name: user_service_api
    ports:
      - "5000:5000"
    volumes:
      - ./User-Service:/app # Bind Mount (Hot reload) live 
    depends_on:
      - user-db
    networks:
      - ds-network

networks:
  ds-network:
    driver: bridge

volumes:
  user_db_data: